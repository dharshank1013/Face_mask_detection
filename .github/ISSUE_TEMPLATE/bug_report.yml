name: "🐛 Bug Report"
description: File a report to help us reproduce and fix a bug in Face Mask Detection
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behavior...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Run `python app.py`
        2. Navigate to 'Live Camera'
        3. Click 'Start Camera'
        4. See error...
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Compute Hardware Device
      description: Which device was active during the issue?
      options:
        - "Intel Arc GPU (XPU)"
        - "NVIDIA GPU (CUDA)"
        - "CPU"
        - "Unknown / Hardware verification failed"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - "Windows 11"
        - "Windows 10"
        - "Linux"
        - "macOS"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "e.g. Python 3.10.11"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Stack Trace
      description: Paste any terminal logs or stack traces here.
      render: shell
